[project]
name = "football-mvp-backend"
version = "0.1.0"
description = "Football Drill MVP - Backend API"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "python-multipart",
    "aiofiles",
    "opencv-python-headless",
    "numpy",
    "scipy",
    "trimesh",
    "onnxruntime",
    "onnx",
]

[tool.vercel]
entrypoint = "backend.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
