services:
  - type: web
    name: football-mvp-backend
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: STORAGE_DIR
        value: /tmp/data
      - key: DATABASE_URL
        value: sqlite:////tmp/data/football.db
