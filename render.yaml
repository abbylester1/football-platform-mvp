services:
  - type: web
    name: football-mvp-backend
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "import cv2, torch, ultralytics, matplotlib, trimesh, scipy; print('all modules cached')"
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --no-server-header
    healthCheckPath: /api/health
    envVars:
      - key: STORAGE_DIR
        value: /tmp/data
      - key: MPLBACKEND
        value: Agg
      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics
